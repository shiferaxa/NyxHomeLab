---
- name: Base setup on every node
  hosts: all
  roles:
    - common

- name: Install container runtime and kubeadm packages
  hosts: all
  roles:
    - k8s_node

- name: Initialise the control plane
  hosts: control_plane
  tasks:
    - name: Check if cluster is already initialised
      ansible.builtin.stat:
        path: /etc/kubernetes/admin.conf
      register: admin_conf

    - name: Run kubeadm init
      ansible.builtin.command: >
        kubeadm init
        --pod-network-cidr={{ pod_cidr }}
        --control-plane-endpoint={{ ansible_host }}
      when: not admin_conf.stat.exists

    - name: Generate join command
      ansible.builtin.command: kubeadm token create --print-join-command
      register: join_cmd
      changed_when: false

    - name: Fetch kubeconfig to the repo root (gitignored)
      ansible.builtin.fetch:
        src: /etc/kubernetes/admin.conf
        dest: "{{ playbook_dir }}/../../kubeconfig"
        flat: true

- name: Join workers
  hosts: workers
  tasks:
    - name: Check if node already joined
      ansible.builtin.stat:
        path: /etc/kubernetes/kubelet.conf
      register: kubelet_conf

    - name: Run join command
      ansible.builtin.command: "{{ hostvars[groups['control_plane'][0]].join_cmd.stdout }}"
      when: not kubelet_conf.stat.exists
